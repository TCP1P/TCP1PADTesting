name: vault-keeper
author: TCP1P
description: >
  **Vault Keeper** — a menu-driven secret vault served over TCP (one process per

  connection via socat). Create, show, edit and delete notes; each note is a

  small heap buffer with a separate metadata struct holding its `{size, data}`.


  It has exactly ONE bug. On delete the service frees a note's data buffer and

  its metadata struct but never clears the slot pointer, leaving it dangling. A

  later create reallocates that freed struct as a fresh data buffer — so writing

  to the new note overwrites the old struct's `{size, pointer}` fields. Forge

  them to point a dangling slot at the binary's fixed-address flag buffer (no

  PIE), then `show` that slot: an arbitrary read that dumps the flag.


  Defenders null the dangling pointer on delete (one line) to kill the

  use-after-free while keeping create/show/edit/delete alive for the SLA

  checker. Attackers leak other teams' flags. The flag is read fresh from

  `$GZCTF_FLAG_FILE` on each connection.
type: AttackDefense
category: Pwn
# containerImage omitted on purpose -> the platform auto-builds ./src/Dockerfile
# on import. Do NOT pin a gzctf-auto/... tag here; that's the platform's own
# build output and would turn this into a non-building "registry image".
container:
  memoryLimit: 256
  cpuCount: 1
  storageLimit: 256
  exposePort: 9000
ad:
  # Functionality-only SLA checker (enochecker3 exit codes). The ./checker image
  # is built automatically from its Dockerfile on sync/import — do NOT set
  # checkerImage here; the tooling builds it and wires up the ref.
  # Public egress enabled.
  allowEgress: true
  allowSelfReset: true
  # Gate SSH behind offense: when true, a team can SSH into its own service
  # container only after capturing at least one flag for this challenge.
  # Default false (SSH open to any team that registered a key).
  sshRequiresFlag: false
  # Bring-your-own-container: each team runs this service on its OWN machine and
  # connects it through the GZCTF tunnel agent (download setup.sh from the
  # challenge panel → `sh setup.sh`). GZCTF launches only a relay; the checker,
  # attack proxy, flag rotation and scoreboard all work unchanged. Set false (or
  # remove) to have GZCTF host the container per team instead.
  selfHosted: true
flags:
- flag{vault-keeper-warmup-0001}
- flag{vault-keeper-warmup-0002}
