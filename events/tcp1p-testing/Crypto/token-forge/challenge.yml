name: token-forge
author: TCP1P
description: >
  **Token Forge** — a tiny members area that authenticates you with a JSON Web

  Token. Visit it and you are issued a `guest` token; `GET /flag` only serves the

  flag to an **admin** token.


  The verifier trusts the token's own `alg` header — and it still honours the

  legendary `alg: "none"` (RFC 7519's *unsecured* JWT, where the signature is

  simply skipped). Forge an `admin` token with no signature and read the flag.


  Standard jeopardy: you get your **own** container with a unique flag injected

  at `$GZCTF_FLAG`. The Flask source is attached so you can spot the bug.
type: DynamicContainer
category: Crypto
flagTemplate: TCP1P{[GUID]}
container:
  flagTemplate: TCP1P{[GUID]}
  memoryLimit: 256
  cpuCount: 1
  storageLimit: 256
  exposePort: 8080
