# supervisord runs as PID 1 so the hill survives a crash: socat spawns one
# ./hill process per TCP connection (a botched exploit only kills that child),
# and supervisord respawns socat itself if it ever dies — WITHOUT the container
# exiting, keeping the shared hill up. NOTE: the platform exposes no in-place
# restart; recreating the container (or a KotH refresh) reverts to this image
# and clears /koth/king. -T 30 reaps idle connections.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:svc]
command=socat -T 30 TCP-LISTEN:9000,reuseaddr,fork EXEC:/app/hill,stderr
directory=/app
autostart=true
autorestart=true
startretries=1000000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
