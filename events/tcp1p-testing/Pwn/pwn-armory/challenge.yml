name: pwn-armory
author: TCP1P
description: >
  **Armory** — a menu-driven heap "item manager" served over TCP (one process

  per connection via socat).


  The binary is compiled deliberately weak (no canary, no PIE, no RELRO, exec

  stack) and is riddled with classic memory-corruption bugs: stack buffer

  overflow, format string, use-after-free, double free, OOB array index,

  signed-size `malloc`, heap overflow, command injection, and an uninitialized

  heap leak. Every bug leads to the flag — redirect into `print_flag()`, flip

  the `admin` guard, or just pop a shell. The flag is read fresh from

  `$GZCTF_FLAG_FILE` on each disclosure.


  Defenders: patch the binary (or source) while keeping the legitimate menu

  flow that the SLA checker drives. Attackers: leak other teams' flags.
type: AttackDefense
category: Pwn
# containerImage omitted on purpose -> the platform auto-builds ./src/Dockerfile
# on import. Do NOT pin a gzctf-auto/... tag here; that's the platform's own
# build output and would turn this into a non-building "registry image".
container:
  memoryLimit: 256
  cpuCount: 1
  storageLimit: 256
  exposePort: 9000
ad:
  # Functionality-only SLA checker (enochecker3 exit codes). The ./checker image
  # is built automatically from its Dockerfile on sync/import — do NOT set
  # checkerImage here; the tooling builds it and wires up the ref.
  # pwn-armory is resettable — a wedged box can be rebuilt from baseline.
  allowEgress: true
  allowSelfReset: true
  # Gate SSH behind offense: when true, a team can SSH into its own service
  # container only after capturing at least one flag for this challenge.
  # Default false (SSH open to any team that registered a key).
  sshRequiresFlag: false
