name: owasp-portal
author: TCP1P
description: >
  **TeamPortal** — a small team notes portal (register, log in, write & search

  private notes, reset your password, import settings/preferences, fetch link

  previews).


  Every legitimate feature also carries one **OWASP Top 10 (2021)**

  vulnerability, and **every one of them leaks the flag.** The platform plants

  a fresh flag into `$GZCTF_FLAG_FILE` each tick and the app mirrors it into the

  admin note / config so each bug class has a path to it.


  Defenders: patch all ten without breaking the SLA checker (it only exercises

  the legitimate features). Attackers: steal other teams' flags via any path.
type: AttackDefense
category: Web
# containerImage omitted on purpose -> the platform auto-builds ./src/Dockerfile
# on import. Do NOT pin a gzctf-auto/... tag here; that's the platform's own
# build output and would turn this into a non-building "registry image".
container:
  memoryLimit: 512
  cpuCount: 1
  storageLimit: 512
  exposePort: 8080
ad:
  # Functionality-only SLA checker (enochecker3 exit codes). The ./checker image
  # is built automatically from its Dockerfile on sync/import — do NOT set
  # checkerImage here; the tooling builds it and wires up the ref.
  # Public egress enabled.
  allowEgress: true
  allowSelfReset: true
  # Gate SSH behind offense: when true, a team can SSH into its own service
  # container only after capturing at least one flag for this challenge.
  # Default false (SSH open to any team that registered a key).
  sshRequiresFlag: false
