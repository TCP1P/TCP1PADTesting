name: shared-portal
author: TCP1P
description: >
  **Shared Portal** — a static-flag web service that runs as ONE shared

  container for the whole game instead of one container per team.


  Every team connects to the **same** instance (great when server resources

  are tight). The page prints the container's hostname so you can confirm it:

  open it from two different teams and you'll see the **same** hostname.


  Static flag — the same for everyone. Just find it on the page.
type: StaticContainer
category: Web
flags:
- TCP1P{shared_container_one_box_for_every_team}
container:
  memoryLimit: 128
  cpuCount: 1
  storageLimit: 256
  exposePort: 8080
  enableSharedContainer: true
