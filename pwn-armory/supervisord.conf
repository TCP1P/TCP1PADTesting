# supervisord runs as PID 1 so the container survives the service dying or
# being restarted in place: an in-place "restart (retain data)" bounces
# [program:svc] and the team's filesystem patches survive.
#
# socat spawns one ./armory process per TCP connection (fork). -T 30 reaps
# idle connections so a stuck client can't pin a process forever.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:svc]
command=socat -T 30 TCP-LISTEN:9000,reuseaddr,fork EXEC:/app/armory,stderr
directory=/app
autostart=true
autorestart=true
startretries=1000000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
